name: roblox-studio-rdp

# Cloud PC for the Roblox publish (roblox-brainrot-01).
# Trigger manually from the GitHub app / mobile web: Actions -> roblox-studio-rdp -> Run workflow.
# The runner is a throwaway Windows VM (windows-latest). It installs RustDesk
# (remote desktop) + Roblox Studio, then stays alive so the user can connect
# from their phone, open game.rbxl in Studio and click File > Publish to Roblox As.
# SECURITY: the repo is on a THROWAWAY GitHub account (never the main account).
# The RustDesk password is random per run and printed in the (public) job log;
# the runner is destroyed when the job ends. Do NOT put any credentials in this repo.

on:
  workflow_dispatch:
    inputs:
      hours:
        description: 'How long to keep the PC alive (hours, max 5)'
        required: false
        default: '2'

jobs:
  studio:
    runs-on: windows-latest
    timeout-minutes: 330
    steps:
      - name: Checkout game files
        uses: actions/checkout@v4

      - name: Decode game.rbxl
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.File]::WriteAllBytes("$env:GITHUB_WORKSPACE\game.rbxl", [Convert]::FromBase64String((Get-Content "$env:GITHUB_WORKSPACE\game.rbxl.b64" -Raw)))
          Write-Output "GAME.RBXL DECODED: $((Get-Item "$env:GITHUB_WORKSPACE\game.rbxl").Length) bytes"

      - name: Install RustDesk
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $rd = "$env:TEMP\rustdesk.exe"
          Invoke-WebRequest -Uri "https://github.com/rustdesk/rustdesk/releases/download/1.5.3/rustdesk-1.5.3-x86_64.exe" -OutFile $rd
          # Random 12-char password for this run only
          $pw = -join ((48..57)+(65..90)+(97..122) | Get-Random -Count 12 | ForEach-Object {[char]$_})
          $pw | Out-File -FilePath "$env:GITHUB_WORKSPACE\rdp-password.txt" -NoNewline
          # --install is INTERACTIVE and hangs on a headless runner; use --silent-install (official RustDesk docs)
          Start-Process -FilePath $rd -ArgumentList "--silent-install"
          $installed = "$env:ProgramFiles\RustDesk\rustdesk.exe"
          $waited = 0
          while (-not (Test-Path $installed) -and $waited -lt 120) { Start-Sleep -Seconds 5; $waited += 5 }
          if (Test-Path $installed) { $rd = $installed }
          Start-Process -FilePath $rd -ArgumentList "--install-service"
          Start-Sleep -Seconds 20
          $svc = Get-Service -Name 'Rustdesk' -ErrorAction SilentlyContinue
          if ($svc -and $svc.Status -ne 'Running') { Start-Service -Name 'Rustdesk' -ErrorAction SilentlyContinue; Start-Sleep -Seconds 10 }
          & $rd --password $pw
          Start-Sleep -Seconds 10
          # Diagnosa: akun apa service-nya jalan + prosesnya hidup atau nggak
          $svcAcct = (Get-CimInstance Win32_Service -Filter "Name='Rustdesk'" -ErrorAction SilentlyContinue).StartName
          Write-Output "RUSTDESK SERVICE ACCOUNT: $svcAcct"
          Write-Output "RUSTDESK PROCESS RUNNING: $(@(Get-Process rustdesk -ErrorAction SilentlyContinue).Count)"
          # --get-id panics on this runner ("failed printing to stdout: pipe is being closed")
          # and returns empty, so read the ID from the RustDesk config file instead.
          # NOTE: the RustDesk service runs as SYSTEM (LocalSystem), so its config may live
          # under the SYSTEM profile, not the runner user's AppData — check both.
          $id = ""
          $roots = @("$env:APPDATA\RustDesk", "$env:APPDATA\RustDesk\config", "$env:SystemRoot\System32\config\systemprofile\AppData\Roaming\RustDesk", "$env:SystemRoot\System32\config\systemprofile\AppData\Roaming\RustDesk\config")
          for ($t = 0; $t -lt 60 -and -not $id; $t += 10) {
            foreach ($root in $roots) {
              if (Test-Path $root) {
                foreach ($f in Get-ChildItem $root -Filter *.toml -ErrorAction SilentlyContinue) {
                  $m = Select-String -Path $f.FullName -Pattern '\bid\s*=' -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($m) { $id = ($m.Line -replace '[^0-9]',''); break }
                }
              }
              if ($id) { break }
            }
            if (-not $id) { Start-Sleep -Seconds 10 }
          }
          $foundFiles = @()
          foreach ($root in $roots) { if (Test-Path $root) { $foundFiles += Get-ChildItem $root -Filter *.toml -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName } } }
          Write-Output "CONFIG FILES FOUND: $($foundFiles -join ' | ')"
          if (-not $id) {
            # --get-id via Start-Process with real file redirection: the call-operator
            # pipe closes early on this GUI exe and makes it panic with no output
            $p = Start-Process -FilePath $rd -ArgumentList "--get-id" -RedirectStandardOutput "$env:TEMP\rd-id.txt" -RedirectStandardError "$env:TEMP\rd-id-err.txt" -WindowStyle Hidden -PassThru
            $p.WaitForExit(30000) | Out-Null
            $id = (Get-Content "$env:TEMP\rd-id.txt" -Raw -ErrorAction SilentlyContinue).Trim()
          }
          Write-Output "=============================="
          Write-Output "RUSTDESK ID: $id"
          Write-Output "RUSTDESK PASSWORD: $pw"
          Write-Output "=============================="

      - name: Install Roblox Studio
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $inst = "$env:TEMP\StudioInstaller.exe"
          # setup.roblox.com fails TLS on this runner (wrong-principal cert error, both IWR and curl); the same file is served from setup.rbxcdn.com (verified 200 OK, and www.roblox.com/download/studio officially redirects to setup.rbxcdn.com)
          $ok = $false
          for ($i = 1; $i -le 3 -and -not $ok; $i++) {
            curl.exe -L --retry 2 -o $inst "https://setup.rbxcdn.com/RobloxStudioLauncherBeta.exe"
            if ((Test-Path $inst) -and (Get-Item $inst).Length -gt 100000) { $ok = $true } else { Start-Sleep -Seconds 10 }
          }
          if (-not $ok) { throw "Studio installer download failed" }
          $p = Start-Process -FilePath $inst -PassThru
          if (-not $p.WaitForExit(600000)) { $p | Stop-Process -Force }
          $studio = Get-ChildItem "$env:LOCALAPPDATA\Roblox\Versions\*\RobloxStudioBeta.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($studio) { Write-Output "STUDIO OK: $($studio.FullName)" } else { Write-Output "STUDIO NOT FOUND - install it manually after connecting" }
          Write-Output "GAME FILE: $env:GITHUB_WORKSPACE\game.rbxl"
          if (Test-Path "$env:GITHUB_WORKSPACE\game.rbxl") { Write-Output "GAME.RBXL PRESENT" } else { Write-Output "GAME.RBXL MISSING" }

      - name: Keep PC alive
        shell: powershell
        run: |
          $hours = [int]"${{ inputs.hours }}"
          if ($hours -lt 1) { $hours = 1 }
          if ($hours -gt 5) { $hours = 5 }
          $end = (Get-Date).AddHours($hours)
          $pw = Get-Content "$env:GITHUB_WORKSPACE\rdp-password.txt" -Raw
          while ((Get-Date) -lt $end) {
            # ID dibaca dari file config (bukan --get-id yang panic di runner ini)
            $id = ""
            foreach ($root in @("$env:APPDATA\RustDesk", "$env:APPDATA\RustDesk\config", "$env:SystemRoot\System32\config\systemprofile\AppData\Roaming\RustDesk", "$env:SystemRoot\System32\config\systemprofile\AppData\Roaming\RustDesk\config")) {
              if (Test-Path $root) {
                foreach ($f in Get-ChildItem $root -Filter *.toml -ErrorAction SilentlyContinue) {
                  $m = Select-String -Path $f.FullName -Pattern '\bid\s*=' -ErrorAction SilentlyContinue | Select-Object -First 1
                  if ($m) { $id = ($m.Line -replace '[^0-9]',''); break }
                }
              }
              if ($id) { break }
            }
            Write-Output "ALIVE until $end | RUSTDESK ID: $id | PASSWORD: $pw"
            Start-Sleep -Seconds 300
          }
          Write-Output "TIME UP - job ends, PC destroyed"
